<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penthouse - Tower A</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-top: 80px; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        h1 { color: #d4af37; margin-bottom: 30px; }
        .contact-info { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .contact-item { margin: 20px 0; }
        .contact-item h3 { color: #333; margin-bottom: 10px; }
        .contact-item p { font-size: 1.1rem; color: #666; }
        .contact-item a { color: #d4af37; text-decoration: none; font-weight: 600; }
        .contact-item a:hover { color: #b8941f; }
        .back-btn { display: inline-block; background: #d4af37; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-bottom: 30px; }
        .back-btn:hover { background: #b8941f; color: white; }
        
        @media (max-width: 768px) {
            .container { padding: 30px 15px; }
            h1 { font-size: 1.8rem; }
            .contact-info { padding: 20px; }
            .contact-item p { font-size: 1rem; }
        }
        
        @media (max-width: 480px) {
            body { padding-top: 70px; }
            .container { padding: 20px 10px; }
            h1 { font-size: 1.5rem; margin-bottom: 20px; }
            .contact-info { padding: 15px; }
            .contact-item { margin: 15px 0; }
            .contact-item h3 { font-size: 1rem; }
            .contact-item p { font-size: 0.9rem; }
            .back-btn { padding: 8px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="navbar-include"></div>
    
    <div class="container">
        <a href="tower-a.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Tower A</a>
        <h1>Penthouse - Tower A</h1>
        <p style="margin-bottom: 30px; font-size: 1.2rem; color: #666;">To view penthouse & visit, contact us:</p>
        
        <div class="contact-info">
            <div class="contact-item">
                <h3><i class="fas fa-phone"></i> Phone</h3>
                <p><a href="tel:03320001888">0332 0001888</a></p>
            </div>
            
            <div class="contact-item">
                <h3><i class="fas fa-envelope"></i> Email</h3>
                <p><a href="mailto:kaurcomplexofficial@hotmail.com">kaurcomplexofficial@hotmail.com</a></p>
            </div>
            
            <div class="contact-item">
                <h3><i class="fab fa-whatsapp"></i> WhatsApp</h3>
                <p><a href="https://wa.me/923320001888" target="_blank">+92 332 0001888</a></p>
            </div>
            
            <div class="contact-item">
                <h3><i class="fas fa-map-marker-alt"></i> Address</h3>
                <p>Tower A, Main Tajabad Road, Peshawar</p>
            </div>
            
            <div class="contact-item">
                <h3><i class="fas fa-clock"></i> Office Hours</h3>
                <p>Mon-Sat, 9:00 AM – 5:00 PM</p>
            </div>
        </div>
    </div>

    <div id="footer-include"></div>

    <script src="../assets/js/main.js"></script>
    <script>
        function includeHTML(id, url, callback) {
            fetch(url).then(res => res.text()).then(data => {
                document.getElementById(id).innerHTML = data;
                if (callback) callback();
            });
        }
        
        includeHTML('navbar-include', '../assets/includes/navbar.html', function() {
            if (typeof initNavigation === 'function') initNavigation();
        });
        includeHTML('footer-include', '../assets/includes/footer.html');
    </script>
</body>
</html>
