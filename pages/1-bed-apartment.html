<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Bed Apartment - Tower A - Kaur Complex</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .apartment-hero {
            background: linear-gradient(135deg, #1a2238, #2c3e50);
            color: white;
            padding: 80px 0;
            text-align: center;
        }
        .apartment-hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #d4af37;
        }
        .apartment-details {
            padding: 60px 0;
            background: #f8f9fa;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        .detail-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .detail-card h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }
        .back-btn {
            background: #d4af37;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="navbar-include"></div>

    <section class="apartment-hero">
        <div class="container">
            <h1>1 Bed Apartment</h1>
            <p>Tower A - Kaur Complex</p>
            <a href="tower-a.html" class="back-btn">← Back to Tower A</a>
        </div>
    </section>

    <section class="apartment-details">
        <div class="container">
            <div class="details-grid">
                <div class="detail-card">
                    <h3>Price Range</h3>
                    <p>48 – 55 Lac PKR</p>
                </div>
                <div class="detail-card">
                    <h3>Area</h3>
                    <p>Approximately 600-700 sq ft</p>
                </div>
                <div class="detail-card">
                    <h3>Features</h3>
                    <ul>
                        <li>Modern Kitchen</li>
                        <li>Spacious Bedroom</li>
                        <li>Full Bathroom</li>
                        <li>Balcony</li>
                    </ul>
                </div>
                <div class="detail-card">
                    <h3>Amenities</h3>
                    <ul>
                        <li>24/7 Security</li>
                        <li>Parking Space</li>
                        <li>Elevator Access</li>
                        <li>Community Areas</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-include"></div>

    <script src="../assets/js/main.js"></script>
    <script>
        function includeHTML(id, url, callback) {
            fetch(url).then(res => res.text()).then(data => {
                document.getElementById(id).innerHTML = data;
                if (callback) callback();
            });
        }
        
        includeHTML('navbar-include', '../assets/includes/navbar.html', function() {
            if (typeof initNavigation === 'function') initNavigation();
        });
        includeHTML('footer-include', '../assets/includes/footer.html');
    </script>
</body>
</html>
