<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Bed – 579 sq ft - Tower C</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding-top: 80px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .video-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        video { width: 100%; height: auto; border-radius: 8px; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .back-btn { display: inline-block; background: #d4af37; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-bottom: 20px; font-weight: 600; }
        .back-btn:hover { background: #b8941f; color: white; }
        .video-error { text-align: center; padding: 40px; color: #666; background: #f9f9f9; border-radius: 8px; }
        .video-error i { font-size: 2rem; margin-bottom: 10px; color: #d4af37; }
        .loading-spinner { display: none; text-align: center; padding: 40px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="navbar-include"></div>
    
    <div class="container">
        <a href="tower-c.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Tower C</a>
        <h1>1 Bed – 579 sq ft - Tower C</h1>
        <div class="video-container">
            <video id="apartmentVideo" controls preload="metadata" playsinline>
                <source src="../assets/videos/tower-c/1 BED 579.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div id="videoError" class="video-error" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Video temporarily unavailable. Please try refreshing the page.</p>
            </div>
        </div>
    </div>

    <div class="whatsapp-float">
        <a href="https://wa.me/923320001888" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <div id="footer-include"></div>

    <script src="../assets/js/main.js"></script>
    <script>
        function includeHTML(id, url, callback) {
            fetch(url).then(res => res.text()).then(data => {
                document.getElementById(id).innerHTML = data;
                if (callback) callback();
            });
        }
        
        includeHTML('navbar-include', '../assets/includes/navbar.html', function() {
            if (typeof initNavigation === 'function') initNavigation();
        });
        includeHTML('footer-include', '../assets/includes/footer.html');
        
        // Video error handling and enhancement
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('apartmentVideo');
            const errorDiv = document.getElementById('videoError');
            
            if (video) {
                video.addEventListener('error', function() {
                    console.log('Video error occurred');
                    video.style.display = 'none';
                    if (errorDiv) errorDiv.style.display = 'block';
                });
                
                video.addEventListener('loadstart', function() {
                    console.log('Video loading started');
                });
                
                video.addEventListener('canplay', function() {
                    console.log('Video can start playing');
                });
            }
        });
    </script>
</body>
</html>
